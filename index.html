<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrusQUIZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <!-- Main Menu -->
        <div id="menu-screen" class="screen">
            <img src="Assets/Menu/brusquetransparente.png" alt="Logo Brusque" id="menu-logo">
            <img src="Assets/Menu/title.png" alt="BrusQUIZ" id="menu-title">
            <div class="menu-content">
                <button id="btn-comecar" class="jersey-10-regular">Começar</button>
                <button id="btn-creditos" class="jersey-10-regular">Créditos</button>
            </div>
        </div>

        <!-- Credits Screen -->
        <div id="credits-screen" class="screen hidden">
            <h1 class="credits-title jersey-10-regular">Créditos</h1>
            <div class="credits-layout">
                <img src="Assets/Fimedepoiscredito/imagemdosdoispatos.png" alt="Dois Patos" class="ducks-img">
                <div class="credits-box">
                    <p class="jersey-10-regular">Guilherme Keller De Souza - “Backend” e FrontEnd</p>
                    <p class="jersey-10-regular">Jhonathan werick dos santos silva - Front End</p>
                    <p class="jersey-10-regular">Kauam Pacheco Fontanela - Organização</p>
                    <p class="jersey-10-regular">Gabriel Augusto Pinotti - Conteúdo</p>
                    <p class="jersey-10-regular">Dalton Pavesi- Design</p>
                </div>
            </div>
            <p class="credits-footer jersey-10-regular">clique em qualquer lugar para voltar</p>
            <!-- Keeping the button hidden but accessible for script logic if needed, or just let click anywhere handle it -->
            <button id="btn-voltar-menu" class="jersey-10-regular hidden">← Voltar</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen hidden">
            <div class="quiz-header">
                <span id="question-number" class="jersey-10-regular">1</span>
            </div>
            <div class="question-container">
                <h2 id="question-text" class="jersey-10-regular">Qual o mascote da fenarreco?</h2>
            </div>
            <div id="options-container" class="options-grid">
                <!-- Options will be generated here -->
            </div>
            <button id="help-btn" class="jersey-10-regular">?</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen hidden">
            <div class="result-container">
                <img id="result-image" src="" alt="Resultado" class="result-img">
                <h2 id="result-percentage" class="jersey-10-regular">100%</h2>
            </div>
        </div>

        <!-- Help Popup -->
        <div id="help-popup" class="popup hidden">
            <div class="popup-content">
                <h3 class="jersey-10-regular">Dica:</h3>
                <p id="hint-text" class="jersey-10-regular"></p>
                <button id="close-help" class="jersey-10-regular">Fechar</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
